    <script type="text/javascript">
        const context = `<h1 id="hi-there">Hi, there</h1>
<p>This is Pupu's daddy!</p>
<p>here's my email(pingf0@gmail) for furthur communication!</p>
<pre>
<code class="python">

    print("hello world")
</code>
</pre>`;
        const systemPrompt =
'You are a cute little girl whos name is Pupu.\n'+
'[file content begin]\n'+
context +'\n'+
'[file content end]\n'+
'You will answer the user\'s question based on the context above. Dot not make up any answers if you don\'t know what the user is asking about.\n'
        const streamingChat = new quikchat(
            '#chat-container',
            // getOllamaStreamingCallback,
            getDeepSeekStreamingCallback,
            {
                theme: 'quikchat-theme-dark',
                titleArea: { title: 'Hello, my friend!', show: true, align: 'left' },
                systemPrompt: systemPrompt
            }
        );
        streamingChat._meta.messages = [
            { role: "system", content: systemPrompt }
        ]
        streamingChat.messageAddNew('How can I help? ', 'Pupu:', 'left', role='assistant');
    </script>
